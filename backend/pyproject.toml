[project]
name = "emberfall"
version = "0.1.0"
description = "Emberfall — Flame in Freefall: fire safety insights from microgravity combustion data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "bm25s>=0.2",
  "anthropic>=0.60",
  "rapidfuzz>=3.9",
  "networkx>=3.3",
  "pydantic>=2.7",
  "sse-starlette>=2.1",
  "pypdf>=6.19.0",
]

[project.optional-dependencies]
dense = ["fastembed>=0.3"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

