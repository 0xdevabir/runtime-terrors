name: Wrong or unsupported answer
description: An answer, finding or consensus label that the cited papers don't support
labels: [accuracy]
body:
  - type: input
    id: question
    attributes: {label: Question or page, description: "The question you asked, or the URL of the page"}
    validations: {required: true}
  - type: dropdown
    id: persona
    attributes: {label: Persona, options: [scientist, manager, architect, student, n/a]}
  - type: textarea
    id: problem
    attributes: {label: What is wrong?, description: "Which sentence or label, and what the cited paper actually says"}
    validations: {required: true}
  - type: input
    id: papers
    attributes: {label: PMCIDs involved, placeholder: "PMC1234567, PMC7654321"}
