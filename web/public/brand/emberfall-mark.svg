<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Emberfall">
  <defs>
    <radialGradient id="emberCore" cx="46%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="28%" stop-color="#ffd60a"/>
      <stop offset="58%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ff453a"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ff453a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- soft freefall aura -->
  <circle cx="16" cy="16" r="14" fill="url(#emberGlow)"/>
  <!-- microgravity spherical flame -->
  <circle cx="16" cy="16.2" r="8.4" fill="url(#emberCore)"/>
  <!-- inner bright core -->
  <circle cx="14.8" cy="14.6" r="2.6" fill="#fff8e6" fill-opacity="0.92"/>
  <!-- freefall orbit (hint of weightlessness) -->
  <ellipse cx="16" cy="16" rx="12.2" ry="4.2" transform="rotate(-28 16 16)"
    stroke="#ff9f0a" stroke-opacity="0.55" stroke-width="1.1" fill="none"/>
  <!-- floating embers -->
  <circle cx="24.2" cy="9.2" r="1.15" fill="#ff9f0a"/>
  <circle cx="7.6" cy="22.4" r="0.85" fill="#ff453a" fill-opacity="0.9"/>
  <circle cx="22.8" cy="21.6" r="0.7" fill="#ffd60a" fill-opacity="0.85"/>
</svg>
